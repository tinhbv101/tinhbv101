name: Generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-matrix-light.svg?color_snake=#00c814&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/snake-matrix-dark.svg?color_snake=#00ff41&color_dots=#161b22,#003b00,#008f11,#00c814,#00ff41

      # Publish generated SVGs to the `output` branch referenced by README.md
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
